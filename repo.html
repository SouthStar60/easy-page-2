<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>简页 - 仓库</title>
    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="stylesheet" href="assets/css/article.css" />
</head>
<body data-page="repo">

    <header class="topnav">
        <div class="topnav-left">
            <button class="topnav-menu" id="menuToggle" aria-label="菜单">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="6" x2="21" y2="6" />
                    <line x1="3" y1="12" x2="21" y2="12" />
                    <line x1="3" y1="18" x2="21" y2="18" />
                </svg>
            </button>
            <span class="topnav-title" data-i18n="site_name">简页</span>
        </div>
        <div class="topnav-right">
            <button class="theme-btn-header" id="themeToggle" aria-label="切换主题">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg>
            </button>
            <button class="lang-btn-header" id="langToggle" aria-label="切换语言">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <line x1="2" y1="12" x2="22" y2="12" />
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
                </svg>
                <span class="lang-label" id="langLabel"></span>
            </button>
        </div>
    </header>

    <div class="drawer-overlay" id="drawerOverlay"></div>
    <nav class="drawer" id="drawer">
        <button class="drawer-close" id="drawerClose" aria-label="关闭菜单">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
        </button>
        <ul class="drawer-nav">
            <li><a href="index.html" data-nav="home"><span data-i18n="nav.home">主页</span></a></li>
            <li><a href="repo.html" class="active" data-nav="repo"><span data-i18n="nav.repo">仓库</span></a></li>
            <li><a href="categories.html" data-nav="categories"><span data-i18n="nav.categories">分类</span></a></li>
            <li><a href="about.html" data-nav="about"><span data-i18n="nav.about">关于</span></a></li>
        </ul>
    </nav>

    <main class="container">
        <div class="section-title">
            <span data-i18n="repos">📦 仓库项目</span>
            <span class="badge" data-i18n="badge">开源</span>
        </div>
        <div class="article-list" id="repoList"></div>

        <div class="footer-note" data-i18n="footer_text">
            时间 <span data-i18n="site_name">简页</span> &mdash; 用 ❤️ 构建
        </div>
    </main>

    <button class="back-top" id="backTop" aria-label="回到顶部">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15" />
        </svg>
    </button>

    <div class="toast" id="toast"></div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/language.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        (function() {
            const repos = BLOG_DATA.repos;
            const container = document.getElementById('repoList');

            function renderRepos() {
                if (!container) return;
                const lang = window.getCurrentLang();
                const langData = window.LANG[lang];
                const viewText = langData.view || '查看 →';

                container.innerHTML = repos.map(repo => {
                    const name = typeof repo.name === 'object' ? (repo.name[lang] || repo.name.zh) : repo.name;
                    const description = typeof repo.description === 'object' ? (repo.description[lang] || repo.description.zh) : repo.description;
                    const languageDisplay = window.LANGUAGE_NAMES && window.LANGUAGE_NAMES[repo.language]
                        ? (window.LANGUAGE_NAMES[repo.language][lang] || window.LANGUAGE_NAMES[repo.language].zh)
                        : repo.language;

                    const coverStyle = repo.image
                        ? `background-image: url('${repo.image}'); background-size: cover; background-position: center;`
                        : `background: linear-gradient(135deg, #1a2a3a, #2d4a6a);`;

                    return `
                        <a href="${repo.link || '#'}" class="article-card">
                            <div class="article-cover" style="${coverStyle}">
                                <span class="cover-tag">${languageDisplay}</span>
                            </div>
                            <div class="article-body">
                                <div class="article-title">${name}</div>
                                <div class="article-excerpt" style="-webkit-line-clamp: 2;">${description}</div>
                                <div class="article-footer">
                                    <span>${viewText}</span>
                                </div>
                            </div>
                        </a>
                    `;
                }).join('');
            }

            renderRepos();
            window.addEventListener('languageChanged', renderRepos);
        })();
    </script>

</body>
</html>
