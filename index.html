            </div>
            <div class="banner-text">

        <section class="profile-card">
            <div class="profile-avatar">名</div>
            <div class="profile-info">

        <div class="stats-row">

            <div class="stat-item"><div class="num">num</div><div class="label" data-i18n="categories">分类</div></div>
            <div class="stat-item"><div class="num">num</div><div class="label" data-i18n="badge">标签</div></div>

                    </svg>

                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z" />
                    </svg>
                </a>
                <a href="https://example.com" aria-label="RSS" data-social="rss">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 11a9 9 0 0 1 9 9" />
                        <path d="M4 4a16 16 0 0 1 16 16" />
                        <circle cx="5" cy="19" r="1" />
                    </svg>
                </a>
                <a href="https://example.com" aria-label="Email" data-social="email">

        <div class="section-title">
            <span data-i18n="articles">文章</span>
            <span class="badge" data-i18n="badge">标签</span>

        <div class="footer-note" data-i18n="footer_text">

    <button class="back-top" id="backTop" aria-label="回到顶部">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15" />
        </svg>
    </button>

    <div class="toast" id="toast"></div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/language.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        (function() {
            function renderArticles() {
                const articles = BLOG_DATA.articles;
                const container = document.getElementById('articleList');
                if (!container) return;

                const lang = window.getCurrentLang();
                const langData = window.LANG[lang];
                const updatedPrefix = langData.updated_prefix || '更新 ';
                const pinnedText = langData.pinned || '置顶';
                const readmoreText = langData.readmore || '阅读全文 →';

                container.innerHTML = articles.map(art => {
                    const title = typeof art.title === 'object' ? (art.title[lang] || art.title.zh) : art.title;
                    const excerpt = typeof art.excerpt === 'object' ? (art.excerpt[lang] || art.excerpt.zh) : art.excerpt;
                    const categoryDisplay = window.CATEGORY_NAMES && window.CATEGORY_NAMES[art.category]
                        ? (window.CATEGORY_NAMES[art.category][lang] || window.CATEGORY_NAMES[art.category].zh)
                        : art.category;

                    const pinHtml = art.pinned ? '<span class="pin-icon">📌</span> ' : '';
                    const dateHtml = art.updated ? updatedPrefix + art.updated : art.date;
                    const coverClass = art.cover || '';
                    const coverStyle = art.image
                        ? `background-image: url('${art.image}'); background-size: cover; background-position: center;`
                        : '';

                    return `
                        <a href="${art.link || '#'}" class="article-card">
                            <div class="article-cover">
                                <div class="cover-img ${coverClass}" style="${coverStyle}"></div>
                                ${art.pinned ? `<span class="cover-tag top">${pinnedText}</span>` : ''}
                                <span class="cover-tag">${art.category}</span>
                            </div>
                            <div class="article-body">
                                <div class="article-title">${pinHtml}${title}</div>
                                <div class="article-meta">
                                    <span>${art.date}</span>
                                    <span class="dot">·</span>
                                    <span>${dateHtml}</span>
                                    <span class="dot">·</span>
                                    <span class="cat">${categoryDisplay}</span>
                                </div>
                                <div class="article-excerpt">${excerpt}</div>
                                <div class="article-footer">
                                    <span>${readmoreText}</span>
                                </div>
                            </div>
                        </a>
                    `;
                }).join('');
            }

            renderArticles();
            window.addEventListener('languageChanged', renderArticles);
        })();
    </script>

</body>
</html>
