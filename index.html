    <!-- 主要内容 -->
    <main class="container">

        <!-- 横幅 -->

            <div class="banner-scene">

                <div class="banner-moon"></div>

                    <span></span><span></span><span></span><span></span><span></span><span></span>
                </div>
            </div>
            <div class="banner-text">
                <h1>简页</h1>
                <p>简页</p>
            </div>
        </section>

        <!-- 个人资料卡片 -->
        <section class="profile-card">
            <div class="profile-avatar">名</div>
            <div class="profile-info">
                <div class="profile-name">名称</div>
                <div class="profile-bio">简介</div>

        <!-- 数据 -->
        <div class="stats-row">
            <div class="stat-item"><div class="num">num</div><div class="label">标签</div></div>
            <div class="stat-item"><div class="num">num</div><div class="label">标签</div></div>
            <div class="stat-item"><div class="num">num</div><div class="label">标签</div></div>
        </div>

        <!-- 社交 -->
        <div class="social-row">
            <div class="social-icons">
                <a href="https://example.com" aria-label="GitHub" data-social="github">

                    </svg>
                </a>
                <a href="https://example.com" aria-label="Twitter" data-social="twitter">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z" />
                    </svg>
                </a>
                <a href="https://example.com" aria-label="RSS" data-social="rss">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 11a9 9 0 0 1 9 9" />
                        <path d="M4 4a16 16 0 0 1 16 16" />

                </a>
            </div>
        </div>

        <!-- 文章列表 -->
        <div class="section-title">
            文章
            <span class="badge">标签</span>
        </div>
        <div class="article-list" id="articleList"></div>

        <div class="footer-note">
            时间 <span>简页</span> &mdash; 用 ❤️ 构建
        </div>
    </main>

    <!-- 返回顶部 -->
    <button class="back-top" id="backTop" aria-label="回到顶部">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15" />
        </svg>
    </button>

    <div class="toast" id="toast"></div>

    <!-- 脚本 -->
    <script src="data.js"></script>
    <script src="main.js"></script>
    <script>
        (function() {
            const articles = BLOG_DATA.articles;
            const container = document.getElementById('articleList');

            if (container) {
    container.innerHTML = articles.map(art => {
        const pinHtml = art.pinned ? '<span class="pin-icon">📌</span> ' : '';
        const dateHtml = art.updated ? '更新 ' + art.updated : art.date;
        // 封面样式：如果有 image 则用背景图，否则用原来的渐变类
        const coverClass = art.cover || '';
        const coverStyle = art.image 
            ? `background-image: url('${art.image}'); background-size: cover; background-position: center;` 
            : '';
        return `
            <a href="${art.link || '#'}" class="article-card" data-id="${art.id}">
                <div class="article-cover">
                    <div class="cover-img ${coverClass}" style="${coverStyle}"></div>
                    ${art.pinned ? '<span class="cover-tag top">置顶</span>' : ''}
                    <span class="cover-tag">${art.category}</span>
                </div>
                <div class="article-body">
                    <div class="article-title">${pinHtml}${art.title}</div>
                    <div class="article-meta">
                        <span>${art.date}</span>
                        <span class="dot">·</span>
                        <span>${dateHtml}</span>
                        <span class="dot">·</span>
                        <span class="cat">${art.category}</span>
                    </div>
                    <div class="article-excerpt">${art.excerpt}</div>
                    <div class="article-footer">
                        <span>阅读全文 →</span>
                    </div>
                </div>
            </a>
        `;
    }).join('');
}
        })();
    </script>

</body>
</html>
