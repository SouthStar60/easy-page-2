<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>简页 - 分类</title>
    <link rel="stylesheet" href="main.css" />
    <link rel="stylesheet" href="article.css" />
    <style>
        .category-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .category-tag {
            padding: 6px 16px;
            border-radius: 30px;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all var(--transition);
            user-select: none;
        }
        .category-tag:hover {
            background: var(--accent-dim);
            color: var(--accent);
            border-color: var(--accent);
        }
        .category-tag.active {
            background: var(--accent-dim);
            color: var(--accent);
            border-color: var(--accent);
        }
        .category-tag .count {
            margin-left: 6px;
            font-size: 0.70rem;
            opacity: 0.6;
        }
        .search-box {
            margin-bottom: 16px;
        }
        .search-box input {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: var(--font);
            outline: none;
            transition: border var(--transition);
        }
        .search-box input:focus {
            border-color: var(--accent);
        }
        .search-box input::placeholder {
            color: var(--text-muted);
        }
        .filter-info {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        .filter-info strong {
            color: var(--text-secondary);
        }
        .no-result {
            color: var(--text-muted);
            text-align: center;
            padding: 40px 0;
        }
    </style>
</head>
<body data-page="categories">

    <!-- 顶部导航 -->
    <header class="topnav">
        <div class="topnav-left">
            <button class="topnav-menu" id="menuToggle" aria-label="菜单">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="6" x2="21" y2="6" />
                    <line x1="3" y1="12" x2="21" y2="12" />
                    <line x1="3" y1="18" x2="21" y2="18" />
                </svg>
            </button>
            <span class="topnav-title" data-i18n="site_name">简页</span>
        </div>
        <div class="topnav-right">
            <button class="theme-btn-header" id="themeToggle" aria-label="切换主题">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg>
            </button>
            <button class="lang-btn-header" id="langToggle" aria-label="切换语言">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <line x1="2" y1="12" x2="22" y2="12" />
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
                </svg>
                <span class="lang-label" id="langLabel">中</span>
            </button>
        </div>
    </header>

    <!-- 抽屉 -->
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <nav class="drawer" id="drawer">
        <button class="drawer-close" id="drawerClose" aria-label="关闭菜单">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
        </button>
        <ul class="drawer-nav">
            <li><a href="index.html" data-nav="home"><span data-i18n="nav.home">主页</span></a></li>
            <li><a href="repo.html" data-nav="repo"><span data-i18n="nav.repo">仓库</span></a></li>
            <li><a href="categories.html" class="active" data-nav="categories"><span data-i18n="nav.categories">分类</span></a></li>
            <li><a href="about.html" data-nav="about"><span data-i18n="nav.about">关于</span></a></li>
        </ul>
    </nav>

    <!-- 主要内容 -->
    <main class="container">
        <div class="section-title">
            <span data-i18n="categories">🏷️ 文章分类</span>
            <span class="badge" data-i18n="badge">浏览</span>
        </div>

        <!-- 搜索框 -->
        <div class="search-box">
            <input type="text" id="categorySearch" data-i18n="search_placeholder" placeholder="搜索文章标题或简介…" />
        </div>

        <!-- 分类标签 -->
        <div class="category-tags" id="categoryTags"></div>

        <!-- 当前筛选信息 -->
        <div class="filter-info" id="filterInfo">
            显示 <strong data-i18n="filter_all">全部</strong> 文章
        </div>

        <!-- 文章列表 -->
        <div class="article-list" id="articleList"></div>

        <!-- 无结果 -->
        <div class="no-result" id="noResult" style="display:none;" data-i18n="no_result">没有找到匹配的文章</div>

        <div class="footer-note" data-i18n="footer_text">
            时间 <span data-i18n="site_name">简页</span> &mdash; 用 ❤️ 构建
        </div>
    </main>

    <!-- 返回顶部 -->
    <button class="back-top" id="backTop" aria-label="回到顶部">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15" />
        </svg>
    </button>

    <div class="toast" id="toast"></div>

    <script src="data.js"></script>
    <script src="language.js"></script>
    <script src="main.js"></script>
    <script>
        (function() {
            const articles = BLOG_DATA.articles;

            // 统计分类
            const catMap = {};
            articles.forEach(a => {
                catMap[a.category] = (catMap[a.category] || 0) + 1;
            });
            const allCategories = Object.keys(catMap).sort();

            // DOM
            const tagsContainer = document.getElementById('categoryTags');
            const searchInput = document.getElementById('categorySearch');
            const articleList = document.getElementById('articleList');
            const filterInfo = document.getElementById('filterInfo');
            const noResult = document.getElementById('noResult');

            let currentCategory = '';
            let currentSearch = '';

            // 渲染文章卡片
            function renderArticles() {
                let filtered = articles;
                if (currentCategory) {
                    filtered = filtered.filter(a => a.category === currentCategory);
                }
                if (currentSearch.trim() !== '') {
                    const keyword = currentSearch.trim().toLowerCase();
                    filtered = filtered.filter(a =>
                        (typeof a.title === 'object' ? a.title.zh : a.title).toLowerCase().includes(keyword) ||
                        (typeof a.excerpt === 'object' ? a.excerpt.zh : a.excerpt).toLowerCase().includes(keyword)
                    );
                }

                const lang = window.getCurrentLang();
                const langData = window.LANG[lang];
                const updatedPrefix = langData.updated_prefix || '更新 ';
                const pinnedText = langData.pinned || '置顶';
                const readmoreText = langData.readmore || '阅读全文 →';

                if (filtered.length === 0) {
                    articleList.innerHTML = '';
                    noResult.style.display = 'block';
                    let msg = '';
                    if (currentCategory && currentSearch) {
                        const catDisplay = window.CATEGORY_NAMES && window.CATEGORY_NAMES[currentCategory]
                            ? (window.CATEGORY_NAMES[currentCategory][lang] || window.CATEGORY_NAMES[currentCategory].zh)
                            : currentCategory;
                        msg = `在「${catDisplay}」分类下没有找到包含 “${currentSearch}” 的文章`;
                    } else if (currentCategory) {
                        const catDisplay = window.CATEGORY_NAMES && window.CATEGORY_NAMES[currentCategory]
                            ? (window.CATEGORY_NAMES[currentCategory][lang] || window.CATEGORY_NAMES[currentCategory].zh)
                            : currentCategory;
                        msg = `「${catDisplay}」分类下暂无文章`;
                    } else if (currentSearch) {
                        msg = `没有找到包含 “${currentSearch}” 的文章`;
                    } else {
                        msg = '没有文章';
                    }
                    filterInfo.innerHTML = msg;
                    return;
                }

                noResult.style.display = 'none';
                let info = '';
                if (currentCategory && currentSearch) {
                    const catDisplay = window.CATEGORY_NAMES && window.CATEGORY_NAMES[currentCategory]
                        ? (window.CATEGORY_NAMES[currentCategory][lang] || window.CATEGORY_NAMES[currentCategory].zh)
                        : currentCategory;
                    info = `在 <strong>${catDisplay}</strong> 分类中搜索 “<strong>${currentSearch}</strong>” 结果（共 ${filtered.length} 篇）`;
                } else if (currentCategory) {
                    const catDisplay = window.CATEGORY_NAMES && window.CATEGORY_NAMES[currentCategory]
                        ? (window.CATEGORY_NAMES[currentCategory][lang] || window.CATEGORY_NAMES[currentCategory].zh)
                        : currentCategory;
                    info = `显示 <strong>${catDisplay}</strong> 分类下的文章（共 ${filtered.length} 篇）`;
                } else if (currentSearch) {
                    info = `搜索 “<strong>${currentSearch}</strong>” 的结果（共 ${filtered.length} 篇）`;
                } else {
                    info = `显示 <strong>全部</strong> 文章（共 ${filtered.length} 篇）`;
                }
                filterInfo.innerHTML = info;

                articleList.innerHTML = filtered.map(art => {
                    const title = typeof art.title === 'object' ? (art.title[lang] || art.title.zh) : art.title;
                    const excerpt = typeof art.excerpt === 'object' ? (art.excerpt[lang] || art.excerpt.zh) : art.excerpt;
                    const categoryDisplay = window.CATEGORY_NAMES && window.CATEGORY_NAMES[art.category]
                        ? (window.CATEGORY_NAMES[art.category][lang] || window.CATEGORY_NAMES[art.category].zh)
                        : art.category;

                    const pinHtml = art.pinned ? '<span class="pin-icon">📌</span> ' : '';
                    const dateHtml = art.updated ? updatedPrefix + art.updated : art.date;
                    const coverClass = art.cover || '';
                    const coverStyle = art.image
                        ? `background-image: url('${art.image}'); background-size: cover; background-position: center;`
                        : '';

                    return `
                        <a href="${art.link || '#'}" class="article-card">
                            <div class="article-cover">
                                <div class="cover-img ${coverClass}" style="${coverStyle}"></div>
                                ${art.pinned ? `<span class="cover-tag top">${pinnedText}</span>` : ''}
                                <span class="cover-tag">${art.category}</span>
                            </div>
                            <div class="article-body">
                                <div class="article-title">${pinHtml}${title}</div>
                                <div class="article-meta">
                                    <span>${art.date}</span>
                                    <span class="dot">·</span>
                                    <span>${dateHtml}</span>
                                    <span class="dot">·</span>
                                    <span class="cat">${categoryDisplay}</span>
                                </div>
                                <div class="article-excerpt">${excerpt}</div>
                                <div class="article-footer">
                                    <span>${readmoreText}</span>
                                </div>
                            </div>
                        </a>
                    `;
                }).join('');
            }

            // 渲染分类标签
            function renderTags(activeCat = '') {
                const lang = window.getCurrentLang();
                tagsContainer.innerHTML = allCategories.map(cat => {
                    const active = (activeCat && cat === activeCat) ? 'active' : '';
                    const displayName = window.CATEGORY_NAMES && window.CATEGORY_NAMES[cat]
                        ? (window.CATEGORY_NAMES[cat][lang] || window.CATEGORY_NAMES[cat].zh)
                        : cat;
                    return `
                        <span class="category-tag ${active}" data-category="${cat}">
                            ${displayName}
                            <span class="count">(${catMap[cat]})</span>
                        </span>
                    `;
                }).join('');

                document.querySelectorAll('.category-tag').forEach(el => {
                    el.addEventListener('click', function() {
                        const cat = this.dataset.category;
                        if (currentCategory === cat) {
                            currentCategory = '';
                        } else {
                            currentCategory = cat;
                        }
                        searchInput.value = '';
                        currentSearch = '';
                        renderTags(currentCategory);
                        renderArticles();
                        articleList.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    });
                });
            }

            // 搜索事件
            searchInput.addEventListener('input', function() {
                const val = this.value;
                if (val.trim() !== '') {
                    currentCategory = '';
                    renderTags('');
                }
                currentSearch = val;
                renderArticles();
            });

            // 初次渲染
            renderTags('');
            renderArticles();

            // 监听语言切换
            window.addEventListener('languageChanged', function() {
                renderTags(currentCategory);
                renderArticles();
            });
        })();
    </script>

</body>
</html>
